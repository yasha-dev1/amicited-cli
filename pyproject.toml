[project]
name = "amicited"
version = "0.1.4"
description = "AmICited CLI and Python SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yasha", email = "yasha1boroumand@gmail.com" }]
keywords = ["ai-search", "cli", "unicode", "watermark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "langchain>=1,<2",
    "langchain-anthropic>=1,<2",
    "langchain-google-genai>=3,<5",
    "langchain-openai>=1,<2",
    "typer>=0.16,<1",
]

[project.scripts]
amicited = "amicited.cli.app:main"

[project.urls]
Repository = "https://github.com/yasha-dev1/amicited-cli"
Issues = "https://github.com/yasha-dev1/amicited-cli/issues"

[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["skills/**"]
data = { data = "skills" }

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["amicited"]
